<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css">

  <meta charset = "UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" cross origin/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <title>This is Sanjay Vasu</title>
</head>

<body>
    
  <div class="scanlines" aria-hidden="true"></div>

  <!-- Header and navigation bar at top of site -->
  <header class="site-header">
    <nav class="nav">
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="#about" class="nav-link">About Me</a></li>
        <li><a href="#interests" class="nav-link">Interests</a></li>
        <li><a href="#projects" class="nav-link">Projects</a></li>
        <li><a href="#awards" class="nav-link">Awards</a></li>
        <li><a href="#experience" class="nav-link">Experience</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>
    </nav>
  </header>
     
  <main>

    <!-- Hero banner section -->
    <section id="hero" class="hero">
      <div class="terminal-window hero-terminal">
        <div class="terminal-titlebar">
          <div class="terminal-dots">
            <span></span><span></span><span></span>
          </div>
          <span class="terminal-title">guest@sanjay-vasu: ~</span>
        </div>

        <div class="terminal-body">
          <p class="boot-lines" id="bootLines"><!-- note to self: js fills this with cool animations--></p>

          <h1 class="hero-name">
            SANJAY VASU
            <span class="hero-role">// aspiring software engineer | competitive chess player | GIIS '27</span>
          </h1>
            
          <p class="hero-tagline">
            I build things that (mostly) don't break, and break things that I (mostly) don't build.
          </p>

          <div class="prompt-line">
            <span class="prompt-symbol">guest@sanjay-vasu: $~</span>
            <input
              type="text"
              id="terminalInput"
              class="prompt-input"
              placeholder="type 'help' and press enter"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

        </div>
      </div>
    </section>

  </main>
</body>
</html>
